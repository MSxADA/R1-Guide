        // --- Components ---
        const ChapterTitle = ({ title, subtitle }) => (

                                </div>

        const EqTab = () => {
            const profiles = {
                jazz: {
                    title: "Jazz",
                    subtitle: "Warmth & Air",
                    desc: "Breathes a touch of wooden resonance into the upright bass and draws out the delicate breath of the saxophone. Perfect for preserving the natural tone of earphones like the Crinacle Zero RED.",
                    preamp: "-2.0",
                    bands: [
                        { id: 1, type: "Low Shelf", freq: "100", gain: "+1.5", q: "0.7" },
                        { id: 2, type: "Peak / Bell", freq: "250", gain: "+1.0", q: "1.0" },
                        { id: 3, type: "Peak / Bell", freq: "3000", gain: "-1.0", q: "2.0" },
                        { id: 4, type: "Peak / Bell", freq: "8000", gain: "+1.5", q: "1.5" },
                    ]
                },
                metal: {
                    title: "Heavy Metal",
                    subtitle: "Speed & Bite",
                    desc: "Adds a fast, visceral punch to the kick drums while scooping out the 'muddy' low-mids. The high-frequency boost adds aggression and 'bite' to heavily distorted guitars.",

                    bands: [
                        { id: 1, type: "Low Shelf", freq: "80", gain: "+3.0", q: "0.7" },
                        { id: 2, type: "Peak / Bell", freq: "300", gain: "-2.0", q: "1.0" },
                        { id: 3, type: "Peak / Bell", freq: "4000", gain: "+2.0", q: "1.5" },

                classic_rock: {

                        { id: 1, type: "Peak / Bell", freq: "150", gain: "+1.5", q: "1.0" },
                        { id: 2, type: "Peak / Bell", freq: "2500", gain: "+2.0", q: "1.5" },

                },
                electronic: {
                    title: "Electronic",
                    subtitle: "Massive Sub & Crisp Highs",
                    desc: "A classic 'V-shape' profile. It introduces a massive, deep sub-bass rumble that you can feel in your chest, cleans up the middle so it doesn't sound boxy, and adds a crisp shimmer to the synths.",
                    preamp: "-4.0",
                    bands: [
                        { id: 1, type: "Low Shelf", freq: "40", gain: "+4.0", q: "0.7" },
                        { id: 2, type: "Peak / Bell", freq: "200", gain: "-1.5", q: "1.0" },

                    bands: [

                        { id: 2, type: "Peak / Bell", freq: "250", gain: "+3.0", q: "0.8" },
                        { id: 3, type: "High Shelf", freq: "6000", gain: "-1.5", q: "0.7" },
                    ]
                },
                world: {

            const [selectedProfile, setSelectedProfile] = useState('jazz');
            const currentData = profiles[selectedProfile];

            return (
                <div className="space-y-12 animate-fade-in font-serif max-w-4xl mx-auto">

                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                        <div className="bg-white p-8 border border-stone-200 rounded-sm shadow-sm relative overflow-hidden">
                            <div className="absolute top-0 left-0 w-1 h-full bg-sapphire"></div>
                            <h3 className="font-display font-bold text-2xl mb-4 text-ink">Decoding the Numbers</h3>
                            <p className="text-stone-600 leading-relaxed mb-6">
                                Standard EQ is like a sledgehammer—turning up the "Bass" turns up <em>everything</em> low. <strong>Parametric EQ (PEQ)</strong> is a scalpel. It lets you isolate the exact snap of a snare drum or the specific rumble of a bass guitar without muddying the rest of the song. Let's break down what the numbers mean:
                            </p>
                            <ul className="space-y-5 text-stone-800">
                                <li className="flex items-start bg-stone-50 p-4 rounded border border-stone-100">
                                    <span className="text-2xl mr-4 mt-0.5 opacity-80">〰️</span>

                                </li>

                                    <br/><br/>
                                    To fix this, we use Preamp Gain to shrink the overall volume of the song slightly <em>before</em> applying our EQ. By setting the Preamp to <strong>-3.0dB</strong>, we create 3 decibels of empty "headroom" at the top of our canvas, giving us a safe space to paint in our new bass boost!
                                </p>
                            </div>

                        <div className="grid grid-cols-1 md:grid-cols-4 gap-6">
